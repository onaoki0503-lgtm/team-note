name: team_note_mobile
description: Team Note — native iOS & Android (H-Village)
publish_to: "none"
version: 0.1.7+11

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  provider: ^6.1.0
  go_router: ^14.2.0
  image_picker: ^1.1.2
  file_picker: ^8.1.0
  geolocator: ^13.0.0
  shared_preferences: ^2.5.6
  path: ^1.9.0
  intl: ^0.20.0
  uuid: ^4.5.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.6
  speech_to_text: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/config/
    - assets/banners/
