name: team_note_mobile
description: Team Note — native iOS & Android (H-Village)
publish_to: "none"
version: 0.1.16+23

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.17.2
  provider: ^6.1.0
  go_router: ^14.2.0
  image_picker: ^1.1.2
  file_picker: ^8.1.0
  geolocator: ^13.0.0
  shared_preferences: ^2.5.6
  path: ^1.9.1
  intl: ^0.20.0
  uuid: ^4.5.0
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.0
  crypto: ^3.0.6
  speech_to_text: ^7.5.0
  flutter_native_splash: ^2.4.8
  local_auth: ^3.0.2
  flutter_secure_storage: ^10.3.4
  url_launcher: ^6.3.3
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/config/
    - assets/banners/
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/brand/app-icon.png
  adaptive_icon_background: "#285782"
  adaptive_icon_foreground: assets/brand/app-icon-foreground.png
  adaptive_icon_foreground_inset: 16
  # Keep icons opaque 8-bit RGB — 16-bit/alpha paths previously produced near-black home icons.
  remove_alpha_ios: true
  background_color_ios: "#285782"

flutter_native_splash:
  color: "#F7FAFC"
  image: assets/brand/splash-logo.png
  color_dark: "#F7FAFC"
  image_dark: assets/brand/splash-logo.png
  android_12:
    color: "#F7FAFC"
    icon_background_color: "#285782"
    image: assets/brand/app-icon-foreground.png
    color_dark: "#F7FAFC"
    icon_background_color_dark: "#285782"
    image_dark: assets/brand/app-icon-foreground.png
  android: true
  ios: true
  web: false
  fullscreen: true
